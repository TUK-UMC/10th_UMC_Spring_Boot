<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>
<h2>로그인</h2>
<form action="/login" method="post">
    <div>
        <label>이메일</label>
        <input type="text" name="username" placeholder="이메일 입력"/>
    </div>
    <div>
        <label>비밀번호</label>
        <input type="password" name="password" placeholder="비밀번호 입력"/>
    </div>
    <button type="submit">로그인</button>
</form>
</body>
</html>
